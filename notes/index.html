<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes | jamesfeldmayer.com</title>
<meta name="description" content="A page of notes.">
<style>
  :root {
    --bg: #0a0e14;
    --fg: #d6e2f0;
    --dim: #6b7a8d;
    --accent: #5eead4;
    --accent2: #a78bfa;
    --card: #111823;
    --border: #1e293b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg); min-height: 100vh;
    font-family: "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    line-height: 1.7;
    background-image:
      radial-gradient(600px 400px at 15% 10%, rgba(94,234,212,0.06), transparent 60%),
      radial-gradient(700px 500px at 85% 90%, rgba(167,139,250,0.06), transparent 60%);
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 4rem 1.5rem 5rem; }
  .prompt { color: var(--dim); font-size: 0.9rem; }
  .prompt b { color: var(--accent); font-weight: normal; }
  h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 600; margin: 0.75rem 0 0.5rem; }
  .tagline { color: var(--dim); margin-bottom: 2.5rem; }
  .note {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 1.1rem 1.4rem; display: flex; gap: 1rem; align-items: baseline;
  }
  .note .marker { color: var(--accent2); }
  footer { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border); color: var(--dim); font-size: 0.85rem; }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <div class="prompt">james@feldmayer:~$ <b>cat ~/notes</b></div>
  <h1>Notes</h1>
  <p class="tagline">A page of notes.</p>

  <div class="note">
    <span class="marker">&gt;</span>
    <span>learn and understand larping and identity more deeply</span>
  </div>

  <footer>
    <a href="/">← back to site index</a>
  </footer>
</div>
</body>
</html>
